<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Q&amp;A — Job Search Agent</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Career Resources Q&amp;A</h1>
    <p class="subtitle">Ask a study/career question. The answer is grounded only in real, ingested source material (RAG).</p>

    <div class="card">
      <form id="ask-form">
        <label for="question">Your question</label>
        <input type="text" id="question" placeholder="e.g. what should I study for SQL fundamentals?" required />
        <button type="submit" id="submit-btn">Ask</button>
      </form>
      <div id="msg" class="msg hidden"></div>
    </div>

    <div id="result-card" class="card hidden">
      <h3 style="margin-top:0;">Answer</h3>
      <div id="answer" class="result-box"></div>
      <p class="subtitle" id="sources-used" style="margin-top:10px;"></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/career-rag.js"></script>
</body>
</html>
