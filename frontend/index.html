<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Search Agent — Log in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main style="max-width: 400px; margin-top: 60px;">
    <h1>Job Search Agent</h1>
    <p class="subtitle">Sign in, or create an account below.</p>

    <div class="card">
      <h2 style="margin-top:0; font-size:16px;">Log in</h2>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required />

        <button type="submit">Log in</button>
      </form>
    </div>

    <div class="card">
      <h2 style="margin-top:0; font-size:16px;">Sign up</h2>
      <form id="signup-form">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required />

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required />

        <button type="submit" class="secondary">Create account</button>
      </form>
    </div>

    <div id="msg" class="msg hidden"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
