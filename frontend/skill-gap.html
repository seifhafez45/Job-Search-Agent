<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Gap — Job Search Agent</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Skill Gap Analysis</h1>
    <p class="subtitle">Compares your uploaded profile against a job description. Upload a CV first if you haven't.</p>

    <div class="card">
      <form id="analyze-form">
        <label for="job-title">Job title</label>
        <input type="text" id="job-title" placeholder="e.g. Backend Engineer" required />

        <label for="job-description">Job description</label>
        <textarea id="job-description" placeholder="Paste the full job description here…" required></textarea>

        <button type="submit" id="submit-btn">Analyze</button>
      </form>
      <div id="msg" class="msg hidden"></div>
    </div>

    <div id="result-card" class="card hidden">
      <h3 style="margin-top:0;">Matched Skills</h3>
      <div id="matched"></div>
      <h3>Missing Skills</h3>
      <div id="missing"></div>
      <h3>Fit Summary</h3>
      <div id="fit-summary" class="result-box"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/skill-gap.js"></script>
</body>
</html>
